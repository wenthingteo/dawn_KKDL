<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷酷的蓝比赛专用</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        :root {
            --darkest: #0a2b1e;
            --darker: #0f3d2c;
            --dark: #14523d;
            --dark-row: #0f402e;
            --accent: #22c55e;
            --accent-light: #86efac;
            --text: #ffffff;
            --muted: #88c9a8;
            --btn-plus: #22c55e;
            --btn-minus: #ef4444;
            --highlight-bg: #423d10;
            --border-hl: #facc15;
            --yellow: #facc15;
            --red: #ef4444;
            --green: #22c55e;
        }
        html, body {
            background: var(--darkest);
            color: var(--text);
            min-height: 100vh;
            height: auto;
            overflow-y: auto;
        }
        .sync-status {
            position: fixed;
            top: 8px;
            right: 8px;
            background: var(--dark);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 100;
        }
        header {
            background: var(--darker);
            padding: 14px 24px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header-title {
            font-size: 1.5rem;
            color: var(--accent-light);
            font-weight: bold;
        }
        main {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 24px;
        }
        .panel {
            background: var(--darker);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--dark);
        }
        .left-panel {
            flex: 1 1 500px;
            min-width: 480px;
        }
        .right-panel {
            flex: 2 1 600px;
            min-width: 520px;
        }
        .panel-title {
            font-size: 1.3rem;
            color: var(--accent-light);
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .clear-btn {
            padding: 6px 14px;
            background: var(--btn-minus);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .gift-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .gift-row {
            background: var(--dark);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            flex-wrap: wrap;
        }
        .gift-row.highlighted {
            background: var(--highlight-bg);
            border: 1px solid var(--border-hl);
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.25);
        }
        .mark-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: #1e3a30;
            color: #777;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .mark-btn.active {
            background: var(--yellow);
            color: #000;
        }
        .gift-name {
            flex: 1;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .emoji {
            font-size: 1.15rem;
        }
        .gift-values {
            width: 100%;
            font-size: 0.75rem;
            color: var(--muted);
            margin: 4px 0 0 32px;
            display: flex;
            gap: 12px;
        }
        .qty-input {
            width: 60px;
            padding: 6px 4px;
            background: var(--darkest);
            border: 2px solid var(--accent);
            color: var(--text);
            border-radius: 6px;
            text-align: center;
            font-size: 0.95rem;
            -moz-appearance: textfield;
            outline: none;
        }
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .btn-group {
            display: flex;
            gap: 3px;
            margin-left: 2px;
        }
        .btn-round {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-plus { background: var(--btn-plus); }
        .btn-minus { background: var(--btn-minus); }
        .total-box {
            margin-top: 18px;
            padding: 14px 20px;
            background: var(--dark);
            border-radius: 10px;
            font-size: 1.15rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid var(--accent);
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .goals-section {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .goals-title {
            font-size: 1.1rem;
            color: var(--accent-light);
            font-weight: bold;
            margin-bottom: 4px;
        }
        .goal-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--dark);
            border-radius: 8px;
            transition: all 0.3s;
            flex-wrap: wrap;
            gap: 8px;
        }
        .goal-row.unlocked {
            background: #166534;
            border: 1px solid #22c55e;
        }
        .goal-name {
            font-size: 0.95rem;
            flex: 1;
        }
        .goal-name input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            width: 110px;
        }
        .goal-target {
            text-align: center;
            color: var(--text);
            font-weight: 500;
        }
        .goal-target input {
            background: var(--darkest);
            border: 1px solid #2a7a5c;
            color: var(--text);
            text-align: center;
            width: 120px;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .goal-diff {
            font-weight: bold;
            width: 120px;
            text-align: right;
        }
        .goal-diff.negative { color: var(--red); }
        .goal-diff.unlocked-text { 
            color: var(--green); 
            font-weight: bold;
        }
        .add-goal-btn {
            margin-top: 8px;
            padding: 8px 14px;
            background: var(--dark);
            border: 1px solid var(--accent);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            align-self: flex-start;
        }
        .strategy-bar {
            margin-bottom: 16px;
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .filter-section {
            margin-bottom: 20px;
        }
        .filter-label {
            margin-bottom: 10px;
            display: block;
            color: var(--muted);
        }
        .multi-select {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            padding: 8px 14px;
            background: var(--dark);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            border: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tag.selected {
            background: var(--accent);
            color: #000;
            border-color: var(--accent-light);
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-top: 10px;
        }
        th {
            background: var(--dark);
            color: var(--accent-light);
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px 14px;
            background: var(--dark-row);
        }
        tr td:first-child { border-radius: 8px 0 0 8px; }
        tr td:last-child { border-radius: 0 8px 8px 0; }
        td input {
            width: 100%;
            padding: 8px 10px;
            background: var(--darkest);
            border: 1px solid #2a7a5c;
            color: var(--text);
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .gift-combo {
            line-height: 1.5;
        }
        .delete-goal-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            margin-left: 8px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="sync-status" id="syncStatus">⚡ 连接中...</div>

    <header>
        <h1 class="header-title">🏁 酷酷的蓝比赛专用</h1>
    </header>
    <main>
        <!-- Left Panel - Gift List -->
        <div class="panel left-panel">
            <h2 class="panel-title">
                礼物清单
                <button class="clear-btn" onclick="clearAllGifts()">🗑️ 一键清空</button>
            </h2>
            <div class="gift-grid" id="giftGrid"></div>
            
            <div class="total-box">
                <div class="total-row">
                    <span>总值 (点数)</span>
                    <span id="grandTotalPoints">0.0</span>
                </div>
            </div>
            <div class="total-box" style="margin-top: 10px;">
                <div class="total-row">
                    <span>总值 (钻石)</span>
                    <span id="grandTotalDiamonds">0</span>
                </div>
            </div>
            
            <!-- Goals Section -->
            <div class="goals-section">
                <h3 class="goals-title">目标 (点数)</h3>
                <div id="goalsContainer"></div>
                <button class="add-goal-btn" onclick="addGoalRow()">+ 添加目标</button>
            </div>
        </div>
        <!-- Right Panel - Tier Table -->
        <div class="panel right-panel">
            <h2 class="panel-title">档位周边</h2>
            
            <div class="strategy-bar">
                <label class="radio-label">
                    <input type="radio" name="strategy" value="fewest" checked onchange="renderTierTable()">
                    最少礼物数
                </label>
                <label class="radio-label">
                    <input type="radio" name="strategy" value="mosttypes" onchange="renderTierTable()">
                    最多礼物种类
                </label>
            </div>
            
            <div class="filter-section">
                <span class="filter-label">包含礼物 (点击选择/取消):</span>
                <div class="multi-select" id="giftTags"></div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width:15%">档位</th>
                        <th style="width:20%">所需钻石</th>
                        <th style="width:30%">可获得周边</th>
                        <th style="width:35%">礼物组合</th>
                    </tr>
                </thead>
                <tbody id="tierBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        // ==================================================
        // 🔴 FIREBASE CONFIG
        // ==================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDUMKaG-iq6gSiVGnkWK7Aexf6A-6LvrKk",
            authDomain: "kkdl-856f4.firebaseapp.com",
            databaseURL: "https://kkdl-856f4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kkdl-856f4",
            storageBucket: "kkdl-856f4.appspot.com",
            messagingSenderId: "1058958114658",
            appId: "1:1058958114658:web:c7ff68bc22e3ac5ea7b63b"
        };
        // ==================================================

        // Init Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const stateRef = db.ref('kkdl_state');
        let localUpdate = false;

        // Gift data — BOTH diamonds AND points saved per gift
        const gifts = [
            { name: "兔兔", emoji: "🐰", diamonds: 299, points: 0.3 },
            { name: "箱箱", emoji: "🎁", diamonds: 600, points: 0.6 },
            { name: "车车", emoji: "🚗", diamonds: 1200, points: 1.2 },
            { name: "飞飞", emoji: "✈️", diamonds: 3000, points: 3.0 },
            { name: "船船", emoji: "🚢", diamonds: 6000, points: 6.0 },
            { name: "火箭", emoji: "🚀", diamonds: 10001, points: 10.0 },
            { name: "地雷", emoji: "💫", diamonds: 18888, points: 18.8 },
            { name: "艇艇", emoji: "🛸", diamonds: 20000, points: 20.0 },
            { name: "华华", emoji: "❀", diamonds: 30000, points: 30.0 },
            { name: "10w+", emoji: "💎", diamonds: 100000, points: 100.0 }
        ];

        // Goals — in points
        let goals = [
            { id: 1, name: "爱心手幅", target: 888.0 },
            { id: 2, name: "吧唧", target: 1888.0 },
            { id: 3, name: "眼睛条", target: 2888.0 }
        ];
        let nextGoalId = 4;
        let quantities = {};
        let highlighted = {};
        let selectedGifts = {};
        gifts.forEach(g => {
            quantities[g.name] = 0;
            highlighted[g.name] = false;
            selectedGifts[g.name] = true;
        });

        // Tier data — BACK TO DIAMONDS
        let tiers = [
            { tier: 10, diamonds: 2990, reward: "徽章、立牌等" },
            { tier: 20, diamonds: 5980, reward: "徽章、立牌等" },
            { tier: 40, diamonds: 11960, reward: "徽章、立牌等" },
            { tier: 66, diamonds: 19734, reward: "徽章、立牌等" }
        ];

        // Format helpers
        function formatPoints(num) { return num.toFixed(1); }
        function formatDiamonds(num) { return Math.round(num).toLocaleString(); }

        // Sync status
        function setSyncStatus(text) {
            document.getElementById('syncStatus').textContent = text;
        }

        // Push to Firebase
        function pushState() {
            localUpdate = true;
            stateRef.set({ quantities, highlighted, selectedGifts, goals, tiers })
                .then(() => setSyncStatus('⚡ 实时同步'))
                .catch(() => setSyncStatus('⚠️ 同步失败'));
            setTimeout(() => localUpdate = false, 500);
        }

        // Listen from Firebase
        stateRef.on('value', (snap) => {
            const data = snap.val();
            if (!data) {
                setSyncStatus('⚡ 就绪');
                renderAll();
                return;
            }
            setSyncStatus('⚡ 实时同步');
            if (!localUpdate) {
                if (data.quantities) quantities = data.quantities;
                if (data.highlighted) highlighted = data.highlighted;
                if (data.selectedGifts) selectedGifts = data.selectedGifts;
                if (data.goals) goals = data.goals;
                if (data.tiers) tiers = data.tiers;
            }
            renderAll();
        });

        function clearAllGifts() {
            if (!confirm('确定全部清零吗？')) return;
            gifts.forEach(g => quantities[g.name] = 0);
            pushState();
            renderAll();
        }

        function renderGiftGrid() {
            const grid = document.getElementById("giftGrid");
            if (grid.children.length === 0) {
                gifts.forEach(gift => {
                    const row = document.createElement("div");
                    row.className = `gift-row`;
                    row.id = `row-${gift.name}`;
                    row.innerHTML = `
                        <button class="mark-btn" id="mark-${gift.name}">!</button>
                        <span class="gift-name">
                            <span class="emoji">${gift.emoji}</span>
                            <span>${gift.name}</span>
                        </span>
                        <input type="number" class="qty-input" id="qty-${gift.name}" 
                               min="0" max="9999" value="${quantities[gift.name]}">
                        <div class="btn-group">
                            <button class="btn-round btn-minus" data-name="${gift.name}" data-delta="-1">−</button>
                            <button class="btn-round btn-plus" data-name="${gift.name}" data-delta="1">+</button>
                        </div>
                    `;
                    grid.appendChild(row);
                });

                grid.querySelectorAll('.mark-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const name = btn.id.replace('mark-', '');
                        highlighted[name] = !highlighted[name];
                        pushState();
                    });
                });

                grid.querySelectorAll('.btn-round').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const name = btn.dataset.name;
                        const delta = parseInt(btn.dataset.delta);
                        quantities[name] = Math.max(0, quantities[name] + delta);
                        pushState();
                    });
                });

                grid.querySelectorAll('.qty-input').forEach(input => {
                    input.addEventListener('change', () => {
                        const name = input.id.replace('qty-', '');
                        quantities[name] = Math.max(0, Math.min(9999, parseFloat(input.value) || 0));
                        input.value = quantities[name];
                        pushState();
                    });
                });
            }

            gifts.forEach(gift => {
                const row = document.getElementById(`row-${gift.name}`);
                const markBtn = document.getElementById(`mark-${gift.name}`);
                const input = document.getElementById(`qty-${gift.name}`);
                input.value = quantities[gift.name] || 0;
                if (highlighted[gift.name]) {
                    row.classList.add('highlighted');
                    markBtn.classList.add('active');
                } else {
                    row.classList.remove('highlighted');
                    markBtn.classList.remove('active');
                }
            });
        }

        function renderGoals(totalPoints) {
            const container = document.getElementById("goalsContainer");
            container.innerHTML = "";
            goals.forEach(goal => {
                const isUnlocked = totalPoints >= goal.target;
                const diff = goal.target - totalPoints;
                const row = document.createElement("div");
                row.className = `goal-row ${isUnlocked ? "unlocked" : ""}`;
                row.innerHTML = `
                    <span class="goal-name">
                        <input type="text" value="${goal.name}" data-id="${goal.id}" class="goal-name-input">
                        ${goals.length > 1 ? `<button class="delete-goal-btn" data-id="${goal.id}">✕</button>` : ""}
                    </span>
                    <span class="goal-target">
                        <input type="number" step="0.1" value="${formatPoints(goal.target)}" 
                               data-id="${goal.id}" class="goal-target-input">
                    </span>
                    <span class="goal-diff ${isUnlocked ? "unlocked-text" : "negative"}">
                        ${isUnlocked ? `+${formatPoints(-diff)}` : `-${formatPoints(diff)}`}
                    </span>
                `;
                container.appendChild(row);
            });

            container.querySelectorAll('.goal-name-input').forEach(input => {
                input.addEventListener('change', () => {
                    const g = goals.find(x => x.id === parseInt(input.dataset.id));
                    if (g) { g.name = input.value; pushState(); }
                });
            });
            container.querySelectorAll('.goal-target-input').forEach(input => {
                input.addEventListener('change', () => {
                    const g = goals.find(x => x.id === parseInt(input.dataset.id));
                    if (g) { g.target = Math.max(0, parseFloat(input.value) || 0); pushState(); renderAll(); }
                });
            });
            container.querySelectorAll('.delete-goal-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (goals.length > 1) {
                        goals = goals.filter(g => g.id !== parseInt(btn.dataset.id));
                        pushState(); renderAll();
                    }
                });
            });
        }

        function addGoalRow() {
            goals.push({ id: nextGoalId++, name: "新目标", target: 0 });
            pushState(); renderAll();
        }

        function renderGiftTags() {
            const container = document.getElementById("giftTags");
            if (!container) return;
            container.innerHTML = "";
            gifts.forEach(g => {
                const tag = document.createElement("span");
                tag.className = `tag ${selectedGifts[g.name] ? "selected" : ""}`;
                tag.textContent = `${g.emoji} ${g.name}`;
                tag.onclick = () => {
                    selectedGifts[g.name] = !selectedGifts[g.name];
                    pushState(); renderGiftTags(); renderTierTable();
                };
                container.appendChild(tag);
            });
        }

        function getTotals() {
            let points = 0, diamonds = 0;
            gifts.forEach(g => {
                const qty = quantities[g.name] || 0;
                points += g.points * qty;
                diamonds += g.diamonds * qty;
            });
            return { points, diamonds };
        }

        function updateTotals() {
            const { points, diamonds } = getTotals();
            document.getElementById("grandTotalPoints").textContent = formatPoints(points);
            document.getElementById("grandTotalDiamonds").textContent = formatDiamonds(diamonds);
        }

        function getSelectedGiftsList() {
            return gifts.filter(g => selectedGifts[g.name]);
        }

        function findClosestCombo(targetDiamonds, pool, strategy) {
            if (pool.length === 0) return { items: [], total: 0 };
            if (strategy === "fewest") {
                const sortedDesc = [...pool].sort((a, b) => b.diamonds - a.diamonds);
                let remaining = targetDiamonds;
                const items = [];
                for (const g of sortedDesc) {
                    if (remaining <= 0) break;
                    if (g.diamonds <= remaining) {
                        const n = Math.floor(remaining / g.diamonds);
                        items.push({ gift: g, count: n });
                        remaining -= n * g.diamonds;
                    }
                }
                if (remaining > 0) {
                    const cover = pool.filter(g => g.diamonds >= remaining).sort((a, b) => a.diamonds - b.diamonds)[0] || sortedDesc[0];
                    items.push({ gift: cover, count: 1 });
                }
                const totalVal = items.reduce((sum, i) => sum + i.gift.diamonds * i.count, 0);
                return { items, total: totalVal };
            } else {
                const sortedAsc = [...pool].sort((a, b) => a.diamonds - b.diamonds);
                let remaining = targetDiamonds;
                const items = [];
                for (const g of sortedAsc) {
                    if (remaining >= g.diamonds) {
                        items.push({ gift: g, count: 1 });
                        remaining -= g.diamonds;
                    }
                }
                if (remaining > 0) {
                    const smallest = sortedAsc[0];
                    const need = Math.ceil(remaining / smallest.diamonds);
                    const existing = items.find(i => i.gift.name === smallest.name);
                    if (existing) existing.count += need;
                    else items.push({ gift: smallest, count: need });
                }
                const totalVal = items.reduce((sum, i) => sum + i.gift.diamonds * i.count, 0);
                return { items, total: totalVal };
            }
        }

        function buildCombo(targetDiamonds, strategy) {
            if (targetDiamonds <= 0) return "—";
            const pool = getSelectedGiftsList();
            if (pool.length === 0) return "请先选择礼物";
            const result = findClosestCombo(targetDiamonds, pool, strategy);
            const grouped = {};
            result.items.forEach(it => {
                grouped[it.gift.emoji] = (grouped[it.gift.emoji] || 0) + it.count;
            });
            return Object.entries(grouped).map(([emoji, n]) => `${n}${emoji}`).join(", ");
        }

        function renderTierTable() {
            const strategy = document.querySelector('input[name="strategy"]:checked')?.value || "fewest";
            const tbody = document.getElementById("tierBody");
            if (!tbody) return;
            tbody.innerHTML = "";
            tiers.forEach((tier, idx) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td><input type="number" value="${tier.tier}" data-idx="${idx}" data-field="tier"></td>
                    <td><input type="number" value="${tier.diamonds}" data-idx="${idx}" data-field="diamonds"></td>
                    <td><input type="text" value="${tier.reward}" placeholder="如：徽章、立牌等"
                               data-idx="${idx}" data-field="reward"></td>
                    <td class="gift-combo">${buildCombo(tier.diamonds, strategy)}</td>
                `;
                tbody.appendChild(row);
            });

            tbody.querySelectorAll('input').forEach(input => {
                input.addEventListener('change', () => {
                    const idx = parseInt(input.dataset.idx);
                    const field = input.dataset.field;
                    if (field === 'tier') tiers[idx].tier = parseInt(input.value) || 0;
                    else if (field === 'diamonds') tiers[idx].diamonds = parseInt(input.value) || 0;
                    else if (field === 'reward') tiers[idx].reward = input.value;
                    pushState(); renderTierTable();
                });
            });
        }

        function renderAll() {
            renderGiftGrid();
            renderGiftTags();
            renderTierTable();
            updateTotals();
            renderGoals(getTotals().points);
        }

        document.addEventListener("DOMContentLoaded", () => { renderAll(); });
    </script>
</body>
</html>
